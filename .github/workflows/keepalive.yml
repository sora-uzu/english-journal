name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsSL --retry 3 --retry-delay 5 "$HEALTH_URL" > /dev/null
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
